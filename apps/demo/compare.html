<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Compare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .split { display: flex; height: 70vh; }
    .panel { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #ddd; }
    .panel:last-child { border-right: none; }
    .panel-header { padding: 6px 16px; background: #333; color: #fff; font-size: 13px; font-weight: 600; }
    .panel-body { flex: 1; overflow: auto; background: #fff; }
    .bottom { height: 30vh; border-top: 2px solid #ddd; overflow: auto; padding: 8px; background: #1e1e1e; }
    .coord-table { width: 100%; border-collapse: collapse; font-family: 'SF Mono', monospace; font-size: 11px; color: #d4d4d4; }
    .coord-table th, .coord-table td { padding: 3px 6px; border: 1px solid #444; text-align: left; }
    .coord-table th { background: #333; color: #aaa; position: sticky; top: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #666; background: #f5f5f5; z-index: 999; }
  </style>
</head>
<body>
  <div id="loading">Loading demo.xmind...</div>
  <div id="main" style="display:none">
    <div class="split">
      <div class="panel">
        <div class="panel-header">SVG 纯渲染（布局坐标直出）</div>
        <div class="panel-body" id="svg-panel"></div>
      </div>
      <div class="panel">
        <div class="panel-header">坐标数据</div>
        <div class="panel-body" id="coords-panel" style="background:#1e1e1e;overflow:auto"></div>
      </div>
    </div>
    <div class="bottom" id="console-panel"></div>
  </div>
  <script type="module" src="./compare.ts"></script>
</body>
</html>
